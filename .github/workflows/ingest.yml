name: Refresh archive
on:
  schedule:
    - cron: "17 */4 * * *"
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Ingestion mode
        type: choice
        options: [refresh, backfill, owasp, hackerone]
        default: refresh
      source:
        description: Configured source ID, or all
        type: string
        default: all
      limit:
        description: Maximum documents per source
        type: choice
        options: ["25", "100", "250", "500"]
        default: "100"
permissions:
  contents: read
concurrency:
  group: archive-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.INGESTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Restore pinned model cache
        id: model_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: public/models
          key: models-${{ runner.os }}-${{ hashFiles('packages/embeddings/config.ts', 'package-lock.json') }}
      - name: Discover and archive
        id: discovery
        continue-on-error: true
        env:
          INGEST_MODE: ${{ inputs.mode || (github.event.schedule == '23 3 * * 0' && 'owasp') || 'refresh' }}
          INGEST_LIMIT: ${{ inputs.limit || '100' }}
          INGEST_SOURCE: ${{ inputs.source || 'all' }}
          HACKERONE_USERNAME: ${{ secrets.HACKERONE_USERNAME }}
          HACKERONE_API_TOKEN: ${{ secrets.HACKERONE_API_TOKEN }}
        run: npm run ingest -- "$INGEST_MODE" --remote --limit "$INGEST_LIMIT" --source "$INGEST_SOURCE"
      - name: Capture public source text
        id: capture
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run capture -- --remote --limit 25
      - name: Refresh public report outcomes
        id: report_facts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run reports:refresh -- --remote --limit 25
      - name: Prepare pinned model
        id: model
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run models:prepare
      - name: Index available revisions
        id: index
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        continue-on-error: true
        run: npm run enrich -- --remote --limit 250
      - name: Match saved searches
        id: alerts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run alerts -- --remote
      - name: Maintain source health and withdrawals
        id: maintenance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run ops -- housekeeping --remote
      - name: Report partial failures
        if: ${{ !cancelled() && (steps.discovery.outcome == 'failure' || steps.capture.outcome == 'failure' || steps.report_facts.outcome == 'failure' || steps.model.outcome == 'failure' || steps.index.outcome == 'failure' || steps.alerts.outcome == 'failure' || steps.maintenance.outcome == 'failure') }}
        run: |
          echo 'One or more stages failed. Successful stages were retained; inspect the Operations page and failed step.'
          exit 1
